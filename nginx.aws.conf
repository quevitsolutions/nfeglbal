server {
    listen 80;
    server_name nfengine.online www.nfengine.online;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nfengine.online www.nfengine.online;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/nfengine.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nfengine.online/privkey.pem;

    # SSL Optimization
    ssl_session_cache shared:LE_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Serve main React frontend application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # HTML: Always revalidate so users get latest app version
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed assets (JS, CSS) — cached long-term (Vite appends content hash)
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images and static assets
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Proxy API requests to backend API container
    location /api {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
