# ═══════════════════════════════════════════════════════════════════════════════
# AIPCORE DEDICATED AWS DOCKER COMPOSE CONFIGURATION
# Optimized for AWS EC2 / ECS Container Deployment
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # AWS Frontend & Nginx Proxy
  aws-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${APP_URL}
        - VITE_BSC_MAINNET_RPC=${VITE_BSC_MAINNET_RPC}
        - VITE_ADMIN_WALLET=${VITE_ADMIN_WALLET}
    container_name: aipcore-aws-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      aws-api:
        condition: service_healthy
    networks:
      - aws_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # AWS Node.js API Service
  aws-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aipcore-aws-api
    env_file:
      - .env.aws
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      aws-db:
        condition: service_healthy
      aws-redis:
        condition: service_healthy
    networks:
      - aws_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AWS Redis Cache Engine
  aws-redis:
    image: redis:7-alpine
    container_name: aipcore-aws-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aws_network
    restart: always

  # AWS PostgreSQL Database Engine
  aws-db:
    image: postgres:16-alpine
    container_name: aipcore-aws-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aws_db_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aws_network
    restart: always

  # AWS Certbot SSL Auto-Renewer
  aws-certbot:
    image: certbot/certbot:latest
    container_name: aipcore-aws-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  aws_db_data:

networks:
  aws_network:
    name: aipcore-aws-net
    driver: bridge
